<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0A400C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gate Scanner - Hutan Pinus Selow Bissoloro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0A400C;
            --secondary: #819067;
            --accent: #28a745;
            --light: #FEFAE0;
            --danger: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0A400C 0%, #1a5c1f 50%, #819067 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0,0,0,0.3);
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .header p {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            gap: 1rem;
        }

        /* Stats Card */
        .stats-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            line-height: 1;
        }

        .stat-number.pulse {
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); color: var(--accent); }
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.25rem;
        }

        .date-badge {
            text-align: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
            font-size: 0.85rem;
            color: var(--secondary);
        }

        /* Scan Button */
        .scan-section {
            width: 100%;
            max-width: 400px;
        }

        .scan-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, #20c997 100%);
            border: none;
            border-radius: 20px;
            padding: 2rem;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.4);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .scan-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(40, 167, 69, 0.5);
        }

        .scan-btn:active {
            transform: scale(0.98);
        }

        .scan-btn i {
            font-size: 3rem;
        }

        /* Scanner Container */
        .scanner-container {
            display: none;
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .scanner-container.active {
            display: block;
        }

        .scanner-header {
            background: var(--primary);
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scanner-header h3 {
            font-size: 1rem;
        }

        .close-scanner {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
        }

        #reader {
            width: 100%;
        }

        #reader video {
            width: 100% !important;
        }

        .scanner-footer {
            padding: 1rem;
            text-align: center;
            background: #f8f9fa;
        }

        .scanner-footer p {
            font-size: 0.85rem;
            color: #666;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 0.75rem;
            width: 100%;
            max-width: 400px;
        }

        .quick-btn {
            flex: 1;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            padding: 1rem;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        /* Last Scan Info */
        .last-scan {
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            width: 100%;
            max-width: 400px;
            color: white;
        }

        .last-scan-header {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .last-scan-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .last-scan-time {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .last-scan-status {
            background: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        /* Success Overlay */
        .success-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(40, 167, 69, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }

        .success-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .success-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .success-detail {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* History Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow: hidden;
        }

        .modal-header {
            background: var(--primary);
            color: white;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.1rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 1rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 0.5rem;
        }

        .history-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .history-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-time {
            font-weight: 600;
            color: var(--primary);
        }

        .history-qr {
            font-size: 0.75rem;
            color: #666;
            font-family: monospace;
        }

        .history-badge {
            background: var(--accent);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .empty-state i {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 1rem;
            display: block;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 1001;
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: var(--danger);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-tree"></i> Hutan Pinus Selow Bissoloro</h1>
        <p>Gate Scanner - Pencatatan Pengunjung Masuk</p>
    </div>

    <div class="main-container">
        <!-- Stats Card -->
        <div class="stats-card">
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-number" id="todayCount">0</div>
                    <div class="stat-label">Scan Hari Ini</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalVisitors">0</div>
                    <div class="stat-label">Total Pengunjung</div>
                </div>
            </div>
            <div class="date-badge">
                <i class="fas fa-calendar-alt"></i>
                <span id="currentDate">Loading...</span>
            </div>
        </div>

        <!-- Scanner Container (hidden by default) -->
        <div class="scanner-container" id="scannerContainer">
            <div class="scanner-header">
                <h3><i class="fas fa-qrcode"></i> Scan QR Code Tiket</h3>
                <button class="close-scanner" onclick="stopScanner()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="reader"></div>
            <div class="scanner-footer">
                <p><i class="fas fa-info-circle"></i> Arahkan kamera ke QR Code pada tiket</p>
            </div>
        </div>

        <!-- Scan Button -->
        <div class="scan-section" id="scanSection">
            <button class="scan-btn" id="scanBtn" onclick="startScanner()">
                <i class="fas fa-qrcode"></i>
                <span>SCAN QR CODE</span>
                <small style="font-weight: normal; font-size: 0.85rem;">Tap untuk scan tiket pengunjung</small>
            </button>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="quick-btn" onclick="showHistory()">
                <i class="fas fa-history"></i> Riwayat
            </button>
            <button class="quick-btn" onclick="manualEntry()">
                <i class="fas fa-keyboard"></i> Manual
            </button>
            <button class="quick-btn" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <!-- Last Scan -->
        <div class="last-scan">
            <div class="last-scan-header">
                <i class="fas fa-clock"></i> Scan Terakhir
            </div>
            <div class="last-scan-content">
                <div class="last-scan-time" id="lastScanTime">-</div>
                <div class="last-scan-status" id="lastScanStatus">Menunggu</div>
            </div>
        </div>
    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="success-text">BERHASIL MASUK!</div>
        <div class="success-detail" id="successDetail">1 Pengunjung Tercatat</div>
    </div>

    <!-- History Modal -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-history"></i> Riwayat Scan Hari Ini</h2>
                <button class="modal-close" onclick="closeHistory()">&times;</button>
            </div>
            <div class="modal-body" id="historyList">
                <div class="empty-state">
                    <i class="fas fa-qrcode"></i>
                    <p>Memuat data...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBGTPNboLMi7zv1m1zSlmZk4or0TR1F6sg",
            authDomain: "registrasipinusselowbissoloro.firebaseapp.com",
            projectId: "registrasipinusselowbissoloro",
            storageBucket: "registrasipinusselowbissoloro.firebasestorage.app",
            messagingSenderId: "185801761825",
            appId: "1:185801761825:web:bc262bb3b2769e964fef60",
            measurementId: "G-1LVJ83FFP6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Global Variables
        let html5QrCode = null;
        let isScanning = false;
        let todayDate = '';
        let scanCount = 0;
        let lastScannedCode = '';
        let lastScanTime = 0;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateDateDisplay();
            loadTodayStats();
        });

        // Update Date Display
        function updateDateDisplay() {
            const now = new Date();
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            
            document.getElementById('currentDate').textContent = 
                `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
            
            todayDate = now.toISOString().split('T')[0];
        }

        // Load Today Stats
        async function loadTodayStats() {
            try {
                const querySnapshot = await db.collection('gate_scans')
                    .where('date', '==', todayDate)
                    .get();
                
                scanCount = querySnapshot.size;
                let totalVisitors = 0;

                querySnapshot.forEach((doc) => {
                    totalVisitors += doc.data().visitorCount || 1;
                });

                document.getElementById('todayCount').textContent = scanCount;
                document.getElementById('totalVisitors').textContent = totalVisitors;

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Start QR Scanner
        async function startScanner() {
            if (isScanning) return;

            const scanSection = document.getElementById('scanSection');
            const scannerContainer = document.getElementById('scannerContainer');

            try {
                html5QrCode = new Html5Qrcode("reader");
                
                scanSection.style.display = 'none';
                scannerContainer.classList.add('active');

                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess,
                    () => {} // ignore failures
                );

                isScanning = true;

            } catch (err) {
                console.error('Error starting scanner:', err);
                showToast('Gagal akses kamera!', true);
                stopScanner();
            }
        }

        // Stop Scanner
        async function stopScanner() {
            const scanSection = document.getElementById('scanSection');
            const scannerContainer = document.getElementById('scannerContainer');

            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (err) {
                    console.error('Error stopping:', err);
                }
            }

            isScanning = false;
            scannerContainer.classList.remove('active');
            scanSection.style.display = 'block';
        }

        // On Scan Success
        async function onScanSuccess(decodedText) {
            // Prevent duplicate scans (within 3 seconds)
            const now = Date.now();
            if (decodedText === lastScannedCode && (now - lastScanTime) < 3000) {
                return;
            }

            lastScannedCode = decodedText;
            lastScanTime = now;

            await stopScanner();
            await recordEntry(decodedText);
        }

        // Record Entry to Firebase
        async function recordEntry(qrData, visitorCount = 1) {
            const now = new Date();
            
            const entryData = {
                date: todayDate,
                qrCode: qrData,
                visitorCount: visitorCount,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                time: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                dayName: ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][now.getDay()],
                hour: now.getHours(),
                minute: now.getMinutes()
            };

            try {
                await db.collection('gate_scans').add(entryData);

                // Update counters
                scanCount++;
                document.getElementById('todayCount').textContent = scanCount;
                document.getElementById('todayCount').classList.add('pulse');
                setTimeout(() => document.getElementById('todayCount').classList.remove('pulse'), 300);

                const totalEl = document.getElementById('totalVisitors');
                totalEl.textContent = parseInt(totalEl.textContent) + visitorCount;
                totalEl.classList.add('pulse');
                setTimeout(() => totalEl.classList.remove('pulse'), 300);

                // Update last scan
                document.getElementById('lastScanTime').textContent = entryData.time;
                document.getElementById('lastScanStatus').textContent = 'Sukses';
                document.getElementById('lastScanStatus').style.background = '#28a745';

                // Show success
                showSuccessOverlay(visitorCount);

            } catch (error) {
                console.error('Error:', error);
                showToast('Gagal menyimpan!', true);
            }
        }

        // Show Success Overlay
        function showSuccessOverlay(count) {
            const overlay = document.getElementById('successOverlay');
            document.getElementById('successDetail').textContent = `${count} Pengunjung Tercatat`;
            overlay.classList.add('active');

            setTimeout(() => {
                overlay.classList.remove('active');
            }, 1500);
        }

        // Manual Entry
        function manualEntry() {
            const count = prompt('Masukkan jumlah pengunjung:');
            if (count && !isNaN(count) && parseInt(count) > 0) {
                recordEntry('MANUAL-' + Date.now(), parseInt(count));
            }
        }

        // Show History
        async function showHistory() {
            document.getElementById('historyModal').classList.add('active');
            const listEl = document.getElementById('historyList');
            
            listEl.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Memuat...</p></div>';

            try {
                const querySnapshot = await db.collection('gate_scans')
                    .where('date', '==', todayDate)
                    .get();

                if (querySnapshot.empty) {
                    listEl.innerHTML = '<div class="empty-state"><i class="fas fa-qrcode"></i><p>Belum ada scan hari ini</p></div>';
                    return;
                }

                let entries = [];
                querySnapshot.forEach((doc) => entries.push(doc.data()));
                entries.sort((a, b) => (b.time || '').localeCompare(a.time || ''));

                let html = '';
                entries.forEach((data) => {
                    const isManual = data.qrCode?.startsWith('MANUAL-');
                    html += `
                        <div class="history-item">
                            <div class="history-info">
                                <div class="history-icon">
                                    <i class="fas fa-${isManual ? 'keyboard' : 'qrcode'}"></i>
                                </div>
                                <div>
                                    <div class="history-time">${data.time || '-'}</div>
                                    <div class="history-qr">${isManual ? 'Manual Entry' : (data.qrCode?.substring(0, 25) + '...')}</div>
                                </div>
                            </div>
                            <div class="history-badge">${data.visitorCount || 1} org</div>
                        </div>
                    `;
                });

                listEl.innerHTML = html;

            } catch (error) {
                console.error('Error:', error);
                listEl.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation"></i><p>Gagal memuat</p></div>';
            }
        }

        // Close History
        function closeHistory() {
            document.getElementById('historyModal').classList.remove('active');
        }

        // Refresh
        function refreshData() {
            loadTodayStats();
            showToast('Data diperbarui!');
        }

        // Toast
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Close modal on outside click
        document.getElementById('historyModal').addEventListener('click', function(e) {
            if (e.target === this) closeHistory();
        });
    </script>
</body>
</html>
